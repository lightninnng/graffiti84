name: Lean CI

on:
  push:
    branches: [main, 'codex/**', 'zcode/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: '1'
        run: lake update

      - name: Fetch Mathlib cache
        run: |
          for attempt in 1 2 3; do
            if lake exe cache get; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Build all layers
        run: lake build

      - name: Audit (no sorry/admit/axiom, layer builds)
        run: bash scripts/audit.sh
